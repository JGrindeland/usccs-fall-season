name: Refresh season data

on:
  schedule:
    - cron: "7,37 * * * *"     # every 30 minutes
  workflow_dispatch:            # "Run workflow" button for an on-demand refresh
  push:
    paths: ["scripts/**", "assets/**"]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Pull from SportsEngine
        run: python scripts/pull.py
      - name: Build page
        run: python scripts/build.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then echo "No changes."; exit 0; fi
          git config user.name "usccs-season-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site
          git commit -m "Refresh season data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
